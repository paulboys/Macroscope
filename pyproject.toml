[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockcharts"
version = "0.6.1"
authors = [
  { name="Paul Boys", email="paul.d.boys@gmail.com" }
]
description = "Quantitative analysis of broad market data: NASDAQ-wide breadth, Treasury yields, relative strength and beta, sector rotation and regime labelling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["quantitative-finance", "market-breadth", "nasdaq", "treasury-yields",
            "regime-detection", "relative-strength", "beta", "screener",
            "heiken-ashi", "rsi", "divergence", "technical-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
  "yfinance>=0.2.38",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "plotly>=5.18.0",
  "dash>=2.14.0",
  "pyarrow>=14.0.0",
  "diskcache>=5.6.0",
  "psutil>=5.9.0",
  "multiprocess>=0.70.0",
  "aeon>=1.6.0,<2.0"
]

[project.urls]
Homepage = "https://github.com/paulboys/HeikinAshi"
Repository = "https://github.com/paulboys/HeikinAshi"
Issues = "https://github.com/paulboys/HeikinAshi/issues"

[project.scripts]
stockcharts-screen = "stockcharts.cli:main_screen"
stockcharts-plot = "stockcharts.cli:main_plot"
stockcharts-rsi-divergence = "stockcharts.cli:main_rsi_divergence"
stockcharts-plot-divergence = "stockcharts.cli:main_plot_divergence"
stockcharts-beta-regime = "stockcharts.cli:main_beta_regime"
stockcharts-plot-beta = "stockcharts.cli:main_plot_beta"
stockcharts-app = "stockcharts.app:main_app"
stockcharts-cache = "stockcharts.cli:main_cache"
stockcharts-yields = "stockcharts.cli:main_yields"
stockcharts-yields-app = "stockcharts.macro_app:main_macro_app"
stockcharts-regime = "stockcharts.cli:main_regime"
stock-agent = "stock_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "mypy>=1.10.0",
  "pydocstyle>=6.3.0",
  "pandas-stubs>=2.0.0",
  "types-requests>=2.31.0",
  "pre-commit>=3.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","D","ANN","B","UP"]
# ANN101 (annotate self) and UP038 (isinstance with a union) were both removed
# from ruff upstream and are absent from the installed 0.14.x. They are listed
# here so the pinned 0.6.4 in .pre-commit-config.yaml agrees with it.
ignore = ["D203","D212","D107","E501","ANN101","UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "ANN202", "ANN001", "ANN003", "ANN204", "D100", "D103", "D200", "D205", "F841", "B017"]
# Dash supplies callback arguments dynamically from component values, so the
# parameters are annotated Any rather than guessed at.
"src/stockcharts/app.py" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
disallow_incomplete_defs = true
disallow_untyped_defs = true
show_error_codes = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "matplotlib.*",
    "pandas.*",
    "plotly.*",
    "dash.*",
    "diskcache.*",
    "aeon.*"
]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"
add-ignore = "D107"

[[tool.mypy.overrides]]
module = [
  "stockcharts.indicators.divergence",
  "stockcharts.indicators.rsi",
  "stockcharts.indicators.pivots",
  "stockcharts.charts.divergence",
]
ignore_errors = true
